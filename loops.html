<h4> Example working code:</h4>

Max loops: <imput id="myNum01" type=number value="4" ><br>
Weird number: <imput id="myWeird" type=number value="2" ><br>

  <imput type=button value="Basic For Loop with Decisions" onclick="{
    document.getElementById('myDiv01').innerHTML = ''
    let myTemp= ''
    let myMax = parseInt(document.getElementById('myNum01').value)

    for (let myLoop = 0; myLoop < myMax; myLoop++ ){
      if (myLoop * 2 > myMax){
        myTemp += ' cool '
      }
      myTemp += 'Loop number: ' + myLoop + ' <br> '
    }
    document.getElementById('myDiv01').innerHTML = myTemp
  }">

    <imput type=button value="Even Number identifier" onclick="{
      document.getElementById('myDiv01').innerHTML = ''
      let myTemp = ''

      let myMax = parseInt(document.getElementById('myNum01').value)

      for (let myLoop = 0; myLoop < myMax; myLoop++ ){
         if (myLoop % 2 == 0){
            myTemp += ' Even Number, '
         }
      myTemp += 'Loop number: ' + myLoop + '<br>'
      }
      document.getElementById('myDiv01').innerHTML = myTemp
  }">
